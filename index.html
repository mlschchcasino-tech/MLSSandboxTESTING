<style>
        /* --- CSS Reset & Core --- */
        *, *::before, *::after { box-sizing: border-box; }
        body, h1, h2, p, ul, figure, blockquote, dl, dd { margin: 0; }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #060e20;
            color: #dee5ff;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            line-height: 1.2;
            transition: background-color 0.5s ease;
            background-size: cover;
            background-position: center;
        }

        /* --- Utility Classes --- */
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-center { justify-content: center; }
        .justify-between { justify-content: space-between; }
        .relative { position: relative; }
        .absolute { position: absolute; }
        .fixed { position: fixed; }
        .inset-0 { top: 0; left: 0; right: 0; bottom: 0; }
        .z-0 { z-index: 0; }
        .z-10 { z-index: 10; }
        .z-45 { z-index: 45; }
        .z-50 { z-index: 50; }
        .z-60 { z-index: 60; }
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .hidden { display: none !important; }
        .p-2 { padding: 0.5rem; }
        .p-3 { padding: 0.75rem; }
        .p-4 { padding: 1rem; }
        .p-8 { padding: 2rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .mb-8 { margin-bottom: 2rem; }
        .mt-4 { margin-top: 1rem; }
        .mt-6 { margin-top: 1.5rem; }
        .mt-8 { margin-top: 2rem; }
        .mt-12 { margin-top: 3rem; }
        .gap-2 { gap: 0.5rem; }
        .gap-4 { gap: 1rem; }
        .gap-6 { gap: 1.5rem; }
        .gap-8 { gap: 2rem; }
        .text-center { text-align: center; }
        .uppercase { text-transform: uppercase; }
        .font-bold { font-weight: 700; }
        .font-black { font-weight: 900; }
        .tracking-widest { letter-spacing: 0.1em; }
        .rounded-full { border-radius: 9999px; }
        .rounded-lg { border-radius: 0.5rem; }
        .border { border: 1px solid rgba(255,255,255,0.1); }
        .shadow-lg { box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .cursor-pointer { cursor: pointer; }
        .transition-all { transition: all 0.3s ease; }
        .backdrop-blur-md { backdrop-filter: blur(12px); }
        .italic { font-style: italic; }

        /* --- Branding & Special Styles --- */
        .neon-text {
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.8), 0 0 20px rgba(0, 229, 255, 0.4);
        }
        .pulse-animation {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .celebration-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 45;
            display: none;
        }
        .celebration-active .celebration-overlay {
            display: block;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.15) 0%, transparent 70%);
        }

        .times-up-overlay {
            position: fixed;
            inset: 0;
            background: rgba(6, 14, 32, 0.95);
            z-index: 55;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(25px);
            animation: fadeIn 0.3s ease-out forwards;
        }
        .times-up-active .times-up-overlay {
            display: flex;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .times-up-text {
            font-size: 12vw;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.05em;
            color: #fff;
            text-shadow: 0 0 20px #00E5FF, 0 0 40px #ec4899;
            animation: textPulse 1.5s infinite ease-in-out;
            transform: rotate(-3deg);
        }
        @keyframes textPulse {
            0%, 100% { transform: rotate(-3deg) scale(1); }
            50% { transform: rotate(-3deg) scale(1.1); }
        }

        .post-timer-img {
            max-width: 90vw;
            max-height: 80vh;
            object-fit: contain;
            box-shadow: 0 0 50px rgba(0, 229, 255, 0.3);
            border: 2px solid rgba(255,255,255,0.1);
        }

        .claimed-badge-v4 {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 50;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
        }
        .celebration-active .claimed-badge-v4 {
            display: flex;
            animation: badgeIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes badgeIn {
            from { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        .neon-badge-content {
            background: rgba(6, 14, 32, 0.95);
            border: 4px solid #ec4899;
            padding: 3rem 6rem;
            border-radius: 1.5rem;
            box-shadow: 0 0 40px #ec4899, inset 0 0 30px #ec4899;
            animation: pulse-pink 2s infinite;
        }
        @keyframes pulse-pink {
            0%, 100% { transform: scale(1); box-shadow: 0 0 40px #ec4899; }
            50% { transform: scale(1.03); box-shadow: 0 0 70px #ec4899; }
        }

        .sparkle {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0;
            animation: sparkle-anim 2s infinite;
        }
        @keyframes sparkle-anim {
            0% { transform: scale(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        /* --- Admin UI --- */
        .admin-drawer {
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: fixed;
            right: 0;
            top: 0;
            height: 100vh;
            width: 350px;
            background: #1f2b49f2;
            backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255,255,255,0.1);
            z-index: 70;
            padding: 2rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .admin-drawer.closed {
            transform: translateX(100%);
        }
        .input-group label {
            display: block;
            font-size: 0.7rem;
            color: #81ecff;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
        }
        .input-group input, .input-group textarea {
            width: 100%;
            background: #060e20;
            border: 1px solid rgba(255,255,255,0.15);
            padding: 0.75rem;
            color: #fff;
            border-radius: 0.5rem;
            font-family: inherit;
        }
        .input-group input:focus, .input-group textarea:focus {
            outline: none;
            border-color: #00E5FF;
        }
        .btn {
            border: none;
            cursor: pointer;
            padding: 1rem;
            border-radius: 0.5rem;
            font-weight: 700;
            text-transform: uppercase;
            transition: 0.2s;
        }
        .btn-primary { background: #00E5FF; color: #060e20; }
        .btn-pink { background: #ec4899; color: #fff; }
        .btn-ghost { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.1); }

        .neon-toggle-btn {
            background: rgba(6, 14, 32, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(236, 72, 153, 0.4);
            color: #ec4899;
            padding: 0.75rem 1.5rem;
            border-radius: 99px;
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: 0.3s;
        }
        .neon-toggle-btn.is-active {
            background: #ec4899;
            color: #fff;
            box-shadow: 0 0 20px #ec4899;
        }

        
        .draggable {
            position: absolute !important;
            cursor: grab;
            user-select: none;
        }
        .draggable:active {
            cursor: grabbing;
        }
        .design-mode-active .draggable {
            border: 2px dashed #ec4899;
            padding: 5px;
        }
        .resize-handle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #00E5FF;
            right: -5px;
            bottom: -5px;
            cursor: se-resize;
            display: none;
        }
        .design-mode-active .resize-handle {
            display: block;
        }
        #mainContentContainer {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
/* --- 4K / High Res Scaling --- */
        @media (min-width: 1920px) {
            #prizeDisplay { font-size: 5rem; }

            #winnerText { font-size: 30rem; }
            #timerDisplay { font-size: 20rem; }

        }
    </style>
</head>

        // --- State Initialization with LocalStorage Persistence ---
        const state = {

        function saveState() {

localStorage.setItem('logoURL', state.logoURL);

        function createSparkles() {
            if (!state.isClaimed) {
                els.celebrationOverlay.innerHTML = '';
                return;
            }
            if (els.celebrationOverlay.children.length > 0) return;

            for (let i = 0; i < 50; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                const size = Math.random() * 10 + 4;
                sparkle.style.width = `${size}px`;
                sparkle.style.height = `${size}px`;
                sparkle.style.left = `${Math.random() * 100}%`;
                sparkle.style.top = `${Math.random() * 100}%`;
                sparkle.style.backgroundColor = i % 2 === 0 ? '#ec4899' : '#00E5FF';
                sparkle.style.animationDelay = `${Math.random() * 2}s`;
                sparkle.style.boxShadow = `0 0 10px ${sparkle.style.backgroundColor}`;
                els.celebrationOverlay.appendChild(sparkle);
            }
        }

        function updateUI() {
            // Timer
            const minutes = Math.floor(state.timeLeft / 60);
            const seconds = state.timeLeft % 60;
            els.timer.innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

            els.winnerText.innerText = state.winnerId;

            els.labelDisplay.innerText = state.labelType;

            // Colors and Background
            els.winnerText.style.color = state.colorWinner;
            els.timer.style.color = state.colorTimer;
            els.timer.style.textShadow = `0 0 20px ${state.colorTimer}CC`;
            els.mainBody.style.backgroundColor = state.bgColor;
            if (state.bgImage) {
                els.mainBody.style.backgroundImage = `url('${state.bgImage}')`;
            } else {
                els.mainBody.style.backgroundImage = 'none';
            }

            // Logo
            

            // Screensaver
            if (state.isScreensaverActive && state.screensaverImage) {
                els.screensaverOverlay.style.display = 'block';
                els.screensaverOverlay.style.backgroundImage = `url('${state.screensaverImage}')`;
            } else {
                els.screensaverOverlay.style.display = 'none';
                if (state.screensaverImage) {
                    els.screensaverOverlay.style.backgroundImage = `url('${state.screensaverImage}')`;
                } else {
                    els.screensaverOverlay.style.backgroundImage = 'none';

            }
            els.inputScreensaver.value = state.screensaverImage.startsWith('data:') ? 'Local file uploaded' : state.screensaverImage;


            // Layout
            const containers = ['prizeContainer', 'winnerContainer', 'timerContainer', 'buttonsContainer'];
            containers.forEach(id => {
                if (state.layoutState[id]) {
                    const el = els[id];
                    if (el && state.layoutState[id]) {
                        el.style.top = state.layoutState[id].top;
                        el.style.left = state.layoutState[id].left;
                        el.style.transform = state.layoutState[id].transform || 'translate(-50%, -50%)';
                        if (state.layoutState[id].scale) {
                            el.style.transform = `${state.layoutState[id].transform} scale(${state.layoutState[id].scale})`;
                        }
                    }
                }
            });
if (state.logoURL) {
                els.displayLogo.src = state.logoURL;
                els.displayLogo.classList.remove('hidden');
            } else {
                els.displayLogo.classList.add('hidden');
            }

            // Visibility & Animations
                        if (state.isRunning) {
                els.mainStartBtn.classList.add('hidden');
                els.mainPauseBtn.classList.remove('hidden');
                els.mainResetBtn.classList.remove('hidden');
                els.mainPauseBtn.innerText = state.isPaused ? 'RESUME TIMER' : 'PAUSE TIMER';
                els.pauseBtn.innerText = state.isPaused ? 'Resume' : 'Pause';
                els.timer.style.opacity = '1';
                els.winnerText.classList.remove('pulse-animation');
                document.body.classList.remove('times-up-active');
            } else if (state.isRevealed) {
                els.mainStartBtn.classList.add('hidden');
                els.mainPauseBtn.classList.add('hidden');
                els.mainResetBtn.classList.remove('hidden');
                els.timer.style.opacity = '1';
                els.winnerText.classList.add('pulse-animation');
                if (!state.isClaimed && !state.overlayManuallyClosed) {
                    document.body.classList.add('times-up-active');
                }
            } else {
                els.mainStartBtn.classList.remove('hidden');
                els.mainPauseBtn.classList.add('hidden');
                els.mainResetBtn.classList.add('hidden');
                els.timer.style.opacity = '0.6';
                els.winnerText.classList.remove('pulse-animation');
                document.body.classList.remove('times-up-active');
            }

            // Claim State
            if (state.isClaimed) {
                document.body.classList.add('celebration-active');
                document.body.classList.remove('times-up-active');
                els.quickClaimBtn.classList.add('is-active');
                els.quickClaimBtn.querySelector('span').innerText = 'Unmark Claimed';
                createSparkles();
            } else {
                document.body.classList.remove('celebration-active');
                els.quickClaimBtn.classList.remove('is-active');
                els.quickClaimBtn.querySelector('span').innerText = 'Mark Claimed';
                els.celebrationOverlay.innerHTML = '';
            }

            // Post Timer Image
            if (state.postTimerImg) els.postTimerImg.src = state.postTimerImg;

            // Sync Admin Inputs
            els.inputWinner.value = state.winnerId;
            els.inputPrize.value = state.prizeText;
            els.inputLabel.value = state.labelType;
            els.inputTimer.value = state.duration;
            els.inputColor.value = state.bgColor;
            els.colorWinner.value = state.colorWinner;
            els.colorTimer.value = state.colorTimer;
            els.inputOverlayDuration.value = state.overlayDuration;
            els.inputPostTimerURL.value = state.postTimerImg.startsWith('data:') ? 'Local file uploaded' : state.postTimerImg;
            els.inputLogo.value = state.logoURL.startsWith('data:') ? 'Local file uploaded' : state.logoURL;
            els.inputBG.value = state.bgImage.startsWith('data:') ? 'Local file uploaded' : state.bgImage;
        }

        function startTimer() {
            if (state.isRunning) return;
            state.isRunning = true;
            state.isPaused = false;
            state.isRevealed = false;
            state.isClaimed = false;
            state.overlayManuallyClosed = false;
            els.timesUpText.classList.remove('hidden');
            els.postTimerImg.classList.add('hidden');
            saveState();
            
            timerInterval = setInterval(() => {
                if (!state.isPaused) {
                    if (state.timeLeft > 0) {
                        state.timeLeft--;
                        localStorage.setItem('timeLeft', state.timeLeft);
                        updateUI();
                    } else {
                        completeTimer();
                    }
                }
            }, 1000);
        }

        function completeTimer() {
            clearInterval(timerInterval);
            state.isRunning = false;
            state.isPaused = false;
            state.isRevealed = true;
            saveState();

            if (state.overlayDuration > 0) {
                overlayTimeout = setTimeout(() => {
                    if (!state.isClaimed && !state.overlayManuallyClosed && state.postTimerImg) {
                        els.timesUpText.classList.add('hidden');
                        els.postTimerImg.classList.remove('hidden');
                    }
                }, state.overlayDuration * 1000);
            }
        }

        function pauseTimer() {
            if (!state.isRunning) return;
            state.isPaused = !state.isPaused;
            saveState();
        }

        function resetTimer() {
            clearInterval(timerInterval);
            clearTimeout(overlayTimeout);
            state.isRunning = false;
            state.isPaused = false;
            state.isRevealed = false;
            state.isClaimed = false;
            state.overlayManuallyClosed = false;
            state.timeLeft = state.duration;
            els.timesUpText.classList.remove('hidden');
            els.postTimerImg.classList.add('hidden');
            saveState();
        }

        function toggleClaim() {
            state.isClaimed = !state.isClaimed;
            if (state.isClaimed) {
                clearTimeout(overlayTimeout);
                document.body.classList.remove('times-up-active');
            }
            saveState();
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(e => console.error(e));
            } else {
                document.exitFullscreen();
            }
        }

        async function fileToBase64(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.readAsDataURL(file);
            });
        }

        // --- Export & Import Logic ---
        function exportConfig() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "voltage_config.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        function handleImport(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const importedState = JSON.parse(event.target.result);
                    // Standard keys check to prevent bad data
                    const validKeys = [
                        'winnerId', 'prizeText', 'duration', 'timeLeft', 
                        'isRunning', 'isPaused', 'isRevealed', 'isClaimed', 'bgImage',
                        'bgColor', 'logoURL', 'labelType', 'colorWinner', 
                        'colorTimer', 'overlayDuration', 'postTimerImg', 'screensaverImage', 'layoutState', 'isScreensaverActive'
                    ];
                    
                    Object.keys(importedState).forEach(key => {
                        if (validKeys.includes(key)) {
                            state[key] = importedState[key];
                        }
                    });
                    
                    // Specific mapping for legacy localStorage names if needed
                    if(importedState.voltage_prize) state.prizeText = importedState.voltage_prize;

                    saveState();
                    window.location.reload(); // Refresh to apply everything cleanly
                } catch (err) {
                    alert("Error importing configuration. Please ensure it's a valid JSON file.");
                    console.error(err);
                }
            };
            reader.readAsText(file);
        }

        // --- Live Input Listeners for Auto-Save ---
        
        // --- Screensaver & Design Mode ---

        function toggleScreensaverFullscreen(activate) {
            if (activate) {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(e => console.error(e));
                }
            } else {
                if (document.fullscreenElement) {
                    document.exitFullscreen().catch(e => console.error(e));
                }
            }
        }

        let isDesignMode = false;


        els.toggleScreensaverBtn.addEventListener('click', () => {
            state.isScreensaverActive = !state.isScreensaverActive;
            saveState();
            toggleScreensaverFullscreen(state.isScreensaverActive);
        });

        els.screensaverOverlay.addEventListener('click', () => {
            state.isScreensaverActive = false;
            saveState();
            toggleScreensaverFullscreen(false);
        });


        els.inputScreensaver.addEventListener('input', (e) => { state.screensaverImage = e.target.value; saveState(); });
        els.fileScreensaver.addEventListener('change', async (e) => {
            if (e.target.files[0]) {
                state.screensaverImage = await fileToBase64(e.target.files[0]);
                saveState();
            }
        });

        els.toggleDesignModeBtn.addEventListener('click', () => {
            isDesignMode = !isDesignMode;
            if (isDesignMode) {
                document.body.classList.add('design-mode-active');
                els.toggleDesignModeBtn.innerText = 'Disable Design Mode';
                els.toggleDesignModeBtn.classList.add('is-active');
            } else {
                document.body.classList.remove('design-mode-active');
                els.toggleDesignModeBtn.innerText = 'Enable Design Mode';
                els.toggleDesignModeBtn.classList.remove('is-active');
            }
        });

        // --- Drag and Drop / Resize Logic ---
        const draggables = document.querySelectorAll('.draggable');
        let isDragging = false;
        let isResizing = false;
        let currentElement = null;
        let startX, startY, initialLeft, initialTop, initialScale;

        function getTranslateValues(element) {
            const style = window.getComputedStyle(element);
            const matrix = new DOMMatrixReadOnly(style.transform);
            return {
                x: matrix.m41,
                y: matrix.m42,
                scale: Math.sqrt(matrix.a * matrix.a + matrix.b * matrix.b) || 1 // simplified scale
            };
        }

        draggables.forEach(draggable => {
            draggable.addEventListener('mousedown', (e) => {
                if (!isDesignMode) return;
                
                if (e.target.classList.contains('resize-handle')) {
                    isResizing = true;
                    currentElement = draggable;
                    startX = e.clientX;
                    startY = e.clientY;
                    
                    const transform = getTranslateValues(currentElement);
                    initialScale = transform.scale;
                    
                    e.stopPropagation(); // prevent drag from starting
                } else {
                    isDragging = true;
                    currentElement = draggable;
                    startX = e.clientX;
                    startY = e.clientY;
                    const rect = currentElement.getBoundingClientRect();
                    // Using left/top from inline style or computed is tricky with translate(-50%, -50%). 
                    // Let's store position as percentage so it responds to screen changes
                    initialLeft = parseFloat(currentElement.style.left) || 50;
                    initialTop = parseFloat(currentElement.style.top) || 50;
                }
            });
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDesignMode || !currentElement) return;

            if (isDragging) {
                // calculate delta in percentages
                const dx = ((e.clientX - startX) / window.innerWidth) * 100;
                const dy = ((e.clientY - startY) / window.innerHeight) * 100;
                
                currentElement.style.left = `${initialLeft + dx}%`;
                currentElement.style.top = `${initialTop + dy}%`;
            } else if (isResizing) {
                // basic scaling logic
                const dx = e.clientX - startX;
                const newScale = Math.max(0.2, initialScale + dx * 0.005); // arbitrary scaling factor
                
                const currentTransform = currentElement.style.transform;
                // replace existing scale or append
                const transformBase = 'translate(-50%, -50%)'; // Assuming this base for now
                currentElement.style.transform = `${transformBase} scale(${newScale})`;
            }
        });

        document.addEventListener('mouseup', () => {
            if (!isDesignMode || !currentElement) return;
            
            if (isDragging || isResizing) {
                // save position
                state.layoutState[currentElement.id] = {
                    left: currentElement.style.left,
                    top: currentElement.style.top,
                    transform: 'translate(-50%, -50%)',
                };
                
                // extract scale if present
                const transform = currentElement.style.transform;
                const scaleMatch = transform.match(/scale\(([^)]+)\)/);
                if (scaleMatch) {
                    state.layoutState[currentElement.id].scale = parseFloat(scaleMatch[1]);
                }
                
                saveState();
            }
            
            isDragging = false;
            isResizing = false;
            currentElement = null;
        });

els.inputWinner.addEventListener('input', (e) => { state.winnerId = e.target.value; saveState(); });
        els.inputPrize.addEventListener('input', (e) => { state.prizeText = e.target.value; saveState(); });
        els.inputLabel.addEventListener('input', (e) => { state.labelType = e.target.value; saveState(); });
        els.inputTimer.addEventListener('input', (e) => { 
            state.duration = parseInt(e.target.value) || 0; 
            if (!state.isRunning && !state.isRevealed) state.timeLeft = state.duration;

        els.colorWinner.addEventListener('input', (e) => { state.colorWinner = e.target.value; saveState(); });

            if (e.target.files[0]) {
                state.postTimerImg = await fileToBase64(e.target.files[0]);

        els.fileLogo.addEventListener('change', async (e) => {
            if (e.target.files[0]) {
                state.logoURL = await fileToBase64(e.target.files[0]);

        els.fileBG.addEventListener('change', async (e) => {

                state.bgImage = await fileToBase64(e.target.files[0]);
                saveState();
            }

        // --- Command Button Listeners ---
        els.toggleAdmin.addEventListener('click', (e) => {
            e.stopPropagation();
            els.adminDrawer.classList.toggle('closed');
        });

        document.addEventListener('click', (e) => {
            if (!els.adminDrawer.classList.contains('closed') && !els.adminDrawer.contains(e.target)) {
                els.adminDrawer.classList.add('closed');
            }
        });

        els.mainStartBtn.addEventListener('click', startTimer);
        els.mainResetBtn.addEventListener('click', resetTimer);
        els.mainPauseBtn.addEventListener('click', pauseTimer);
        els.quickClaimBtn.addEventListener('click', toggleClaim);
        els.mainToggleScreensaverBtn.addEventListener('click', () => {
            state.isScreensaverActive = !state.isScreensaverActive;
            saveState();
            toggleScreensaverFullscreen(state.isScreensaverActive);
        });
        els.startBtn.addEventListener('click', startTimer);
        els.resetBtn.addEventListener('click', resetTimer);
        els.pauseBtn.addEventListener('click', pauseTimer);
        els.adminClaimToggle.addEventListener('click', toggleClaim);
        els.adminFullscreenBtn.addEventListener('click', toggleFullscreen);
        els.mainFullscreenBtn.addEventListener('click', toggleFullscreen);
        
        els.btnExport.addEventListener('click', exportConfig);
        els.btnImport.addEventListener('click', () => els.fileImport.click());
        els.fileImport.addEventListener('change', handleImport);

        els.closeTimesUp.addEventListener('click', () => {
            state.overlayManuallyClosed = true;
            document.body.classList.remove('times-up-active');
            clearTimeout(overlayTimeout);
        });

        // --- Dual Window Sync ---
        window.addEventListener('storage', (e) => {
            const keysToSync = [
                'winnerId', 'voltage_prize', 'duration', 'timeLeft', 
                'isRunning', 'isPaused', 'isRevealed', 'isClaimed', 'bgImage',
                'bgColor', 'logoURL', 'labelType', 'colorWinner', 
                'colorTimer', 'overlayDuration', 'postTimerImg', 'screensaverImage', 'layoutState', 'isScreensaverActive'
            ];
            
            if (keysToSync.includes(e.key)) {
                let val = e.newValue;
                const stateKey = e.key === 'voltage_prize' ? 'prizeText' : e.key;
                
                if (['duration', 'timeLeft', 'overlayDuration'].includes(e.key)) val = parseInt(val);
                
                if (['isRunning', 'isPaused', 'isRevealed', 'isClaimed', 'isScreensaverActive'].includes(e.key)) val = val === 'true';
                if (e.key === 'layoutState') val = JSON.parse(val);

                
                state[stateKey] = val;
                updateUI();
            }
        });

        // Initialize
        updateUI();
        if (state.isRunning) {
            state.isRunning = false;
            state.isPaused = false; // reset flag to trigger a clean start
            startTimer();
        }
    </script>
